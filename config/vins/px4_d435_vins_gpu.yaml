%YAML:1.0

# Camera-to-flight-controller calibration source:
# D:/kalibr-master/results/extrinsics/20261025_213352_imu_cam_01733a/parameters/imu_cam-camchain-imucam.yaml
# Output paths are relative to the project root; start_drone.sh sets that directory.
#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam;
imu: 1
num_of_cam: 2

#imu_topic: "/uav1/camera/imu"
imu_topic: "/mavros/imu/data_raw"
image0_topic: "/uav1/camera/infra1/image_rect_raw"
image1_topic: "/uav1/camera/infra2/image_rect_raw"
output_path: "runtime/outputs/vins/"

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 480


# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0  # Refine online around the latest offline camera-to-IMU transforms below.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

# camera
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   # Kalibr T_cam_imu inverted to VINS-Fusion body_T_cam (camera -> IMU).
   data:  [ 0.069301654422004422, 0.058413112330125083, 0.9958841242846882, 0.0953409210764119,
            -0.9975446280727196, 0.014163935584733722, 0.068586426733065475, 0.031631130226906126,
            -0.01009929193714687, -0.99819201120659085, 0.05925127058307339, -0.23280579262801318,
            0, 0, 0, 1 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   # Kalibr T_cam_imu inverted to VINS-Fusion body_T_cam (camera -> IMU).
   data:  [ 0.06411891254627039, 0.059790893055895522, 0.99614949388204899, 0.099228493433711845,
            -0.99789430824063596, 0.013627394482138233, 0.063413277005459123, -0.018409892359249044,
            -0.0097833856525557095, -0.99811790046427218, 0.060538765580136461, -0.23309328730247553,
            0, 0, 0, 1 ]

#Multiple thread support
multiple_thread: 1

# CUDA acceleration (GPU workspace only)
use_gpu: 1
use_gpu_acc_flow: 1
use_f_ransac: 0              # optional; disabled for this camera/motion profile
use_failure_detection: 1     # logging-only by default; reset requires a separate validation pass
failure_track_threshold: 30
failure_detection_frames: 5

#feature traker paprameters
max_cnt: 250             # max feature number in feature tracking 150
min_dist: 25            # min distance between two features  30
freq: 7.5                 # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image
F_threshold: 0.8        # ransac threshold (pixel) 0.8
show_track: 0           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.04       # max solver itration time (ms), to guarantee real time
max_num_iterations: 8      # max solver itrations, to guarantee real time
keyframe_parallax: 10.0      # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.209478 #0.0209478 #0.02           # accelerometer measurement noise standard deviation. #0.2   0.04
gyr_n: 0.0162563 #0.00162563 #0.002          # gyroscope measurement noise standard deviation.     #0.05  0.004
acc_w: 0.00291921 #0.000291921 #0.0005         # accelerometer bias random work noise standard deviation.  #0.002
gyr_w: 0.000131438 #0.0000131438 #0.00003        # gyroscope bias random work noise standard deviation.     #4.0e-5
g_norm: 9.791        # gravity magnitude

#unsynchronization parameters
estimate_td: 1                    # Refine online from the offline calibration value.
td: -0.022156338918546313  # t_imu = t_cam + td; Kalibr cam0 timeshift_cam_imu

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "runtime/outputs/pose_graph/" # save and load path
save_image: 0                   # save image in pose graph for visualization prupose; you can close this function by setting 0
